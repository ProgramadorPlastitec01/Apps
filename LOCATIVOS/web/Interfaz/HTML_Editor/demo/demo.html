<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>jQuery TE | Downloaded Demo | v.1.4.0</title>
        <link type="text/css" rel="stylesheet" href="demo.css">
        <link type="text/css" rel="stylesheet" href="../jquery-te-1.4.0.css">
        <script type="text/javascript" src="query.min.js" charset="utf-8"></script>
        <script type="text/javascript" src="../jquery-te-1.4.0.min.js" charset="utf-8"></script>
        <script language="JavaScript">
            function function1() {
                var m = document.getElementById("myA");
                document.getElementById("otro").value = m.innerText;
            }
        </script>
    </head>
    <body>
        <p>Click in the following element:</p>
        <a id="myA" href="http://www.java2s.com" onclick="return(false);"
           onmouseup="function1();">Hyper link to java2s.com
        </a>
        <!------------------------------------------------------------ jQUERY TEXT EDITOR ------------------------------------------------------------>
        <textarea name="textarea" class="jqte-test">
            
        </textarea>
        <textarea name="textarea" class="jqte-test"></textarea>
        <input name="input" type="text" value="<b>My contents are from <u><span style=&quot;color:rgb(0, 148, 133);&quot;>INPUT</span></u></b>" class="jqte-test">
        <span name="span" class="jqte-test Notedit"><b>My contents are from <u><span style="color:rgb(0, 148, 133);">SPAN</span></u></b></span>
        <script>
            $('.jqte-test').jqte();
	
            // settings of status
            var jqteStatus = true;
            $(".status").click(function()
            {
                jqteStatus = jqteStatus ? false : true;
                $('.jqte-test').jqte({"status" : jqteStatus})
            });
        </script>
        <hr>
    </body>
</html>
