<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">

    </head>
    <body >
        <script src="api_google_1.js"></script>
        <script src="api_google_2.js"></script>

        <script src="Js_mapa.js"></script>

       <ul id="org" style="display:none">

                    </li>

                                    <li>Granny Smith</li>

                                <ul>

                                    <li>Cucumber</li>

                        </ul>
                    </li>
                    <li>Bread</li>
                    <li class="collapsed">Chocolate
                        <ul>
                            <li>Topdeck</li>
                            <li>Reese's Cups</li>

        </ul>     
        
        <div id="chart" class="orgChart"></div>
