formB.title = Informaci\u00f3n complementaria
formB.SectionOne = \u00bfAlguno de los administradores (representantes legales, director ejecutivo o miembros de la junta directiva) es considerado una Persona Pol\u00edticamente Expuesta (PEP)? Una PEP se define como una persona que ocupa o ha ocupado un cargo o funci\u00f3n p\u00fablica destacada.
