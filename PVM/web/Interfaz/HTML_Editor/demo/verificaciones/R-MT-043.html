<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>jQuery TE | Downloaded Demo | v.1.4.0</title>
        <link type="text/css" rel="stylesheet" href="../demo.css">
        <link type="text/css" rel="stylesheet" href="../../jquery-te-1.4.0.css">
        <script type="text/javascript" src="http://code.jquery.com/jquery.min.js" charset="utf-8"></script>
        <script type="text/javascript" src="../../jquery-te-1.4.0.min.js" charset="utf-8"></script>
        <script type="text/javascript">
            function marcar(check,id){
                var element = document.getElementById(id);
                if (check.checked) {
                    element.setAttribute("checked", "");
                }else{
                    element.removeAttribute("checked");
                }
            }
            function agregar(){
                var table = document.getElementById("table1");
                var rowCount = table.rows.length;
                var row = table.insertRow(rowCount);
                var TdFecha = row.insertCell(0);
                TdFecha.setAttribute("contenteditable","true")
                TdFecha.innerHTML = "&nbsp;";
                var TdEjecuto = row.insertCell(1);
                TdEjecuto.setAttribute("contenteditable","true")
                TdEjecuto.innerHTML = "&nbsp;";
                var TdDescripcion = row.insertCell(2);
                TdDescripcion.setAttribute("contenteditable","true")
                TdDescripcion.setAttribute("onclick","agregar()")
                TdDescripcion.setAttribute("colspan","3")
                TdDescripcion.setAttribute("valign","top")
                TdDescripcion.innerHTML = "&nbsp;";
            }
        </script>
    </head>
    <body>
        <!------------------------------------------------------------ jQUERY TEXT EDITOR ------------------------------------------------------------>
        <textarea name="textarea" class="jqte-test">
            <table style="width: 100%" class="tableHTMLEditor" id="table1" contenteditable="false">
                <tr>
                    <td colspan="8" style="background-color:#CCC;" align="center"><b style="color:white;">COPIA NO CONTROLADA</b></td>
                </tr>
                <tr>
                    <td style="width:10%" align="center">
                   <img src="../../../Contenido/images/Logo.png" alt="Logo" style="width:200px;height:70px" /></td>
                <td align="center" style="width:60%" colspan="5"><b style="color:#292929">VERIFICACION RUGOSIMETRO</b></td>
                <td align="center" style="width:40%" contenteditable="false" colspan="2"><b style="color:#292929">CODIGO : R-MT-043 <hr /> VERSION : 01</b></td>
                </tr>
                <tr>
                <td colspan="4"><b style="color:#292929">MAGNITUD: </b><u contenteditable="true">&nbsp;Rugosidad&nbsp;</u></td>
                <td colspan="4"><b style="color:#292929">PATRONES REFERENCIA: </b><u contenteditable="true">&nbsp;Galga de rugosidad de presicion&nbsp;</u></td>
                </tr>
                <tr>
                <td colspan="4"><b style="color:#292929">INSTRUMENTO: </b><u contenteditable="true">&nbsp;Rugosimetro&nbsp;</u></td>
                <td colspan="4"><b style="color:#292929">METODO: </b><u contenteditable="true">&nbsp;Comparacion&nbsp;</u></td>
                </tr>
                <tr>
                    <td align="center" style="width: 10%;"><b style="color:#68BB18;">FECHA: </b><u contenteditable="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u></td>
                    <td align="center" rowspan="2" style="width: 10%;"><b style="color:#68BB18;">LECTURA PATRON (Ra) &mu; m </b></td>
                    <td align="center" colspan="6" style="width: 10%;"><b style="color:#68BB18;">LECTURAS (Ra) Cut off 0.8mm x 5</b></td>
                </tr>
                <tr>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">NUMERO SERIAL: </b><u contenteditable="true">&nbsp;&nbsp;Serie_R&nbsp;&nbsp;&nbsp;</u></td>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">M1</b></td>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">M2</b></td>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">M3</b></td>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">M4</b></td>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">PROMEDIO LECTURA</b></td>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">LECTURA FINAL</b></td>
                </tr>
                <tr>
                    <td align="center" style="width: 5%;"><b style="color:#68BB18;">AREA: </b><u contenteditable="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u></td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                    <td contenteditable="true" align="center">&nbsp;</td>
                </tr>
                <tr>
                    <td colspan="4"><b style="color:#292929;">EQUIPO APROBO VERIFICACION: </b><b>SI</b><input type="checkbox" id="1" onclick="marcar(this,1)"/><b> NO</b><input type="checkbox" id="2" onclick="marcar(this,2)"/></td>
                    <td colspan="4"><b style="color:#292929;">VERIFICACION EFECTUADA POR: </b><u contenteditable="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u></td>
                </tr>
                <tr>
                    <td colspan="8"><b style="color:#292929;">OBSERVACIONES DE AJUSTES Y VERIFICACION EFECTUADAS: </b> <u contenteditable="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u></td>
                </tr>
                </table>
        </textarea>
        <script>
            $('.jqte-test').jqte();

            // settings of status
            var jqteStatus = true;
            $(".status").click(function()
            {
                jqteStatus = jqteStatus ? false : true;
                $('.jqte-test').jqte({"status" : jqteStatus})
            });
        </script>
    </body>
</html>
