<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>jQuery TE | Downloaded Demo | v.1.4.0</title>
        <link type="text/css" rel="stylesheet" href="../demo.css">
        <link type="text/css" rel="stylesheet" href="../../jquery-te-1.4.0.css">
        <script type="text/javascript" src="http://code.jquery.com/jquery.min.js" charset="utf-8"></script>
        <script type="text/javascript" src="../../jquery-te-1.4.0.min.js" charset="utf-8"></script>
        <script type="text/javascript">
            function marcar(check,element){
                if (!check.checked) {
                    element.setAttribute("checked", "true");
                }else{
                    element.removeAttribute("checked");
                }
            }
            function agregar(){
                var table = document.getElementById("table1");
                var rowCount = table.rows.length;
                var row = table.insertRow(rowCount);
                var TdFecha = row.insertCell(0);
                TdFecha.setAttribute("contenteditable","true")
                TdFecha.innerHTML = "&nbsp;";
                var TdEjecuto = row.insertCell(1);
                TdEjecuto.setAttribute("contenteditable","true")
                TdEjecuto.innerHTML = "&nbsp;";
                var TdDescripcion = row.insertCell(2);
                TdDescripcion.setAttribute("contenteditable","true")
                TdDescripcion.setAttribute("onclick","agregar()")
                TdDescripcion.setAttribute("colspan","3")
                TdDescripcion.setAttribute("valign","top")
                TdDescripcion.innerHTML = "&nbsp;";
            }
        </script>
    </head>
    <body>
        <!------------------------------------------------------------ jQUERY TEXT EDITOR ------------------------------------------------------------>
        <textarea name="textarea" class="jqte-test">
            <table style="width: 100%" class="tableHTMLEditor" id="table1" contenteditable="false">
                <tr>
                    <td colspan="4" style="background-color:#CCC;" align="center"><b style="color:white;">COPIA NO CONTROLADA</b></td>
                </tr>
                <tr>
                    <td style="width:20%" align="center">
                   <img src="../../../Contenido/images/Logo.png" alt="Logo" style="width:200px;height:70px" /></td>
                <td align="center" style="width:60%" colspan="2"><b style="color:#292929">INSPECCION REGLAS METALICAS GRADUADAS<br />ASOCIADO R-MT-042</b></td>
                <td align="center" style="width:40%" contenteditable="false"><b style="color:#292929">CODIGO : R-MT-052 <hr /> VERSION : 01</b></td>
                </tr>
                <tr>
                <td colspan="4"><b style="color:#292929">LINEA: </b><u contenteditable="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u></td>
                </tr>
                <tr>
                    <td align="center"><b style="color:#68BB18;">SERIE NUMERO</b></td>
                    <td align="center"><b style="color:#68BB18;">FECHA INSPECCION</b></td>
                    <td align="center"><b style="color:#68BB18;">PROXIMA FECHA</b></td>
                    <td align="center"><b style="color:#68BB18;">INSPECCIONÓ: </b><u contenteditable="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u></td>
                </tr>
                <tr>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                    <td rowspan="4" align="center">STICKER</td>
                </tr>
                <tr>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                </tr>
                <tr>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                </tr>
                <tr>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                    <td contenteditable="true">&nbsp;</td>
                </tr>
                </table>
        </textarea>
        <script>
            $('.jqte-test').jqte();

            // settings of status
            var jqteStatus = true;
            $(".status").click(function()
            {
                jqteStatus = jqteStatus ? false : true;
                $('.jqte-test').jqte({"status" : jqteStatus})
            });
        </script>
    </body>
</html>
